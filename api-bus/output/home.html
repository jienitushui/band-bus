					var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
					var r = window.location.search.substr(1).match(reg);
					if (r != null)
						return unescape(r[2]);
					return null;
				}
			})(jQuery);
			var areacode = $.getUrlParam('areacode');
			var text = $.getUrlParam('text');
			if (text) {

			getCityConfig(areacode, text);
